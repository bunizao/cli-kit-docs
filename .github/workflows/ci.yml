name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Reference pages are generated from data/*.commands.json; a diff means someone edited them by hand.
      - run: npm run check
      - run: npm run lint
      - run: npm run validate
      - run: npm run broken-links
